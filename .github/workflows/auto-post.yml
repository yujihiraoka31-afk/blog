amlname: 毎日自動ブログ投稿

on:
  schedule:
    # 毎朝9時（日本時間）に自動実行
    # UTC で 0時 = 日本時間 9時
    - cron: '0 0 * * *'
  # 手動でもテスト実行できるようにする
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: 記事を自動生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: 生成した記事を保存
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add _posts/
          git diff --staged --quiet || git commit -m "自動投稿: $(date '+%Y-%m-%d')"
          git push
